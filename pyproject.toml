[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ztm-ingest"
version = "0.1.0"
description = "Ingestion of Warsaw public transport (ZTM) open data into a bronze layer"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
]

[project.optional-dependencies]
azure = [
    "azure-storage-blob>=12.19",
    "azure-identity>=1.15",
]

[dependency-groups]
dev = [
    "ztm-ingest[azure]",  # so tests and mypy also cover the Azure writer
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.17.4",
    "mypy>=1.10",
    "types-requests",
    "pre-commit>=3.7",
    "dbt-core>=1.11,<1.12",
    "dbt-duckdb>=1.11,<1.12",
]


[project.scripts]
ztm-ingest = "ztm_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=ztm_ingest --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4"]
ignore = ["S101"]  # asserts are fine in tests

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["azure.*"]
ignore_missing_imports = true
